    <span style="color: #bababa">…but make it </span><span style="color: #ff754c">{{picked}}.</span>
  </div>

  <div role="radiogroup" aria-label="Genre" style="margin-top: 22px; padding: 0 4px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
    <sc-for list="{{genres}}" as="g" hint-placeholder-count="12">
      <button role="radio" aria-checked="{{g.checked}}" onClick="{{g.pick}}" style="{{g.style}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg>
