<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cover, sung by (#a259ff)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#d9d9d9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121212; font-family: 'DM Sans', system-ui, sans-serif; color: #d9d9d9; box-sizing: border-box; padding: 48px 16px 36px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; flex-shrink: 0">
    <a href="CfCover1.dc.html" aria-label="Back" style="display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px 0 8px; box-sizing: border-box; border-radius: 18px; background: rgba(162,89,255,0.16); border: 1px solid rgba(162,89,255,0.4); color: #a259ff; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Cover</a>
    <span style="font-size: 13px; color: #bababa">Step 2 of 2</span>
  </div>

  <a href="CfCover1.dc.html" aria-label="In Too Deep by Sum 41, change song" style="margin-top: 20px; align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #d9d9d9; text-align: center">
    <span style="width: 136px; height: 136px; border-radius: 18px; background: #474747; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: rgba(217,217,217,0.55); margin-bottom: 10px">S41</span>
    <span style="font-size: 26px; line-height: 1.15; font-weight: 700">In Too Deep</span>
    <span style="font-size: 15px; color: #bababa">Sum 41</span>
  </a>

  <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #2e2e2e; text-align: center; font-size: 30px; line-height: 1.15; font-weight: 700">
    <span style="color: #bababa">…sung by </span><span style="color: #a259ff">{{picked}}.</span>
  </div>

  <div role="radiogroup" aria-label="Singer" style="margin-top: 22px; padding: 0 4px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px">
    <sc-for list="{{artists}}" as="r" hint-placeholder-count="7">
      <button role="radio" aria-checked="{{r.checked}}" onClick="{{r.pick}}" style="{{r.style}}">
        <span aria-hidden="true" style="{{r.avatar}}">{{r.initials}}</span>
        {{r.name}}
      </button>
    </sc-for>
  </div>

  <a href="CfGenCover.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #a259ff; color: #121212; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Generate cover</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var ARTISTS = ['Arijit Singh', 'Taylor Swift', 'Fred again..', 'Billie Eilish', 'The Weeknd', 'Dua Lipa', 'Kendrick Lamar'];
var TONES = ['#474747', '#5e5e5e', '#2e2e2e'];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'Arijit Singh' }; }
  renderVals() {
    var picked = this.state.picked;
    var pill = 'height: 48px; padding: 0 18px 0 6px; border-radius: 24px; font-family: inherit; font-size: 16px; display: flex; align-items: center; gap: 10px; ';
    return {
      picked: picked,
      artists: ARTISTS.map((name, k) => ({
        name: name,
        checked: name === picked ? 'true' : 'false',
        initials: name.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).map((w) => w[0]).join('').slice(0, 2),
        pick: () => this.setState({ picked: name }),
        avatar: 'width: 36px; height: 36px; flex-shrink: 0; border-radius: 18px; background: ' + TONES[k % 3] + '; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: rgba(217,217,217,0.7)',
        style: pill + (name === picked ? 'background: #a259ff; color: #121212; font-weight: 700; border: 1px solid #a259ff' : 'background: transparent; color: #d9d9d9; font-weight: 500; border: 1px solid #474747')
      }))
    };
  }
}
</script>
</body>
</html>
