<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create home, orange with playful icons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#d9d9d9}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121212; font-family: 'DM Sans', system-ui, sans-serif; color: #d9d9d9; box-sizing: border-box; display: flex; flex-direction: column">

  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Mozart</div>
      <button aria-label="Profile" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #2e2e2e; font-family: inherit; font-size: 15px; font-weight: 600; color: #d9d9d9; padding: 0">A</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 24px; line-height: 1.15; font-weight: 700; white-space: nowrap">What do you want to make?</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.4; color: #bababa; white-space: nowrap">Pick a song you love or describe something new.</p>
    </div>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px; flex-grow: 1">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
      <a href="{{m.href}}" style="position: relative; overflow: hidden; display: flex; align-items: center; min-height: 112px; box-sizing: border-box; padding: 0 120px 0 22px; border-radius: 20px; background: {{m.color}}; text-decoration: none; color: #121212">
        <span style="display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0">
          <span style="font-size: 26px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em">{{m.name}}</span>
          <span style="font-size: 15px; font-weight: 500; color: rgba(18,18,18,0.72)">{{m.desc}}</span>
        </span>
        <svg width="104" height="104" viewBox="0 0 24 24" fill="none" stroke="rgba(18,18,18,0.55)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: -6px; bottom: -18px; transform: rotate(-14deg)"><path d="{{m.icon}}"></path></svg>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Main" style="height: 72px; border-top: 1px solid #2e2e2e; display: flex; padding-bottom: 8px; box-sizing: border-box">
    <a href="CfHome.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #d9d9d9; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
      Create
    </a>
    <a href="CfLibrary.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #bababa; font-size: 12px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      Library
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      modes: [
        { name: 'Remix', desc: 'Same song, new genre.', href: 'CfRemix1.dc.html', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM6.5 12A5.5 5.5 0 0 1 12 6.5M17.5 12a5.5 5.5 0 0 1-5.5 5.5', color: '#ff754c', tint: 'rgba(242,242,242,0.14)', edge: 'rgba(242,242,242,0.35)' },
        { name: 'Cover', desc: 'Same song, new artist.', href: 'CfCover1.dc.html', icon: 'M12 2a3.5 3.5 0 0 0-3.5 3.5v5a3.5 3.5 0 0 0 7 0v-5A3.5 3.5 0 0 0 12 2zM8.5 7.5h7M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V22M9 22h6', color: '#a259ff', tint: 'rgba(162,89,255,0.14)', edge: 'rgba(162,89,255,0.35)' },
        { name: 'Rewrite', desc: 'Same song, new lyrics.', href: 'CfRewrite1.dc.html', icon: 'M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM7 8.5h10M7 12h6', color: '#2ec4b6', tint: 'rgba(46,196,182,0.14)', edge: 'rgba(46,196,182,0.35)' },
        { name: 'Something new', desc: 'Prompt a brand-new song.', href: 'CfVibe.dc.html', icon: 'M2.6 19.6L12.6 9.6L14.4 11.4L4.4 21.4ZM10.6 11.6L12.4 13.4M18 2.5Q18.5 5.5 21.5 6Q18.5 6.5 18 9.5Q17.5 6.5 14.5 6Q17.5 5.5 18 2.5ZM8 2Q8.3 3.7 10 4Q8.3 4.3 8 6Q7.7 4.3 6 4Q7.7 3.7 8 2ZM20.5 12.5Q20.7 13.8 22 14Q20.7 14.2 20.5 15.5Q20.3 14.2 19 14Q20.3 13.8 20.5 12.5Z', color: '#ffc93c', tint: 'rgba(255,201,60,0.14)', edge: 'rgba(255,201,60,0.35)' }
      ]
    };
  }
}
</script>
</body>
</html>
