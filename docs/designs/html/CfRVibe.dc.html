<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vibe from the player, recipient</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

<style>
body{margin:0}
a{color:#d9d9d9}a:hover{color:#ffffff}
textarea:focus{outline:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #121212; font-family: 'DM Sans', system-ui, sans-serif; color: #d9d9d9; box-sizing: border-box; display: flex; flex-direction: column">

  <div style="padding: 48px 16px 0">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; flex-shrink: 0">
      <a href="CfPlayerTilesR.dc.html" aria-label="Back" style="display: flex; align-items: center; gap: 4px; height: 36px; padding: 0 14px 0 8px; box-sizing: border-box; border-radius: 18px; background: rgba(255,201,60,0.16); border: 1px solid rgba(255,201,60,0.4); color: #ffc93c; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Vibe</a>
    </div>

    <sc-if value="{{big}}" hint-placeholder-val="{{ true }}">
      <a href="CfPlayerTilesR.dc.html" aria-label="Cruel Summer × Bollywood, Ali, back to the player" style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #d9d9d9; text-align: center">
        <span style="width: 136px; height: 136px; border-radius: 18px; background: #474747; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: rgba(217,217,217,0.55); margin-bottom: 10px">A</span>
        <span style="font-size: 26px; line-height: 1.15; font-weight: 700">Cruel Summer × Bollywood</span>
        <span style="font-size: 15px; color: #bababa">Ali</span>
      </a>
    </sc-if>
    <sc-if value="{{focus}}" hint-placeholder-val="{{ false }}">
      <a href="CfPlayerTilesR.dc.html" aria-label="Cruel Summer × Bollywood, Ali, back to the player" style="margin-top: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #d9d9d9">
        <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 10px; background: #474747; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: rgba(217,217,217,0.55)">A</span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Cruel Summer × Bollywood</span><span style="font-size: 14px; color: #bababa">Ali</span></span>
      </a>
    </sc-if>

    <div style="{{lineStyle}}">
      <span style="color: #bababa">…but </span><span style="color: #ffc93c">your way.</span>
    </div>

    <div style="{{boxStyle}}">
      <label for="vb" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Describe how to change this song</label>
      <textarea id="vb" value="{{text}}" onChange="{{onText}}" onFocus="{{onFocus}}" onBlur="{{onBlur}}" style="position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; padding: 18px 20px; border: none; background: transparent; resize: none; font-family: inherit; font-size: 20px; line-height: 1.32; font-weight: 500; color: #d9d9d9; caret-color: #ffc93c"></textarea>
      <sc-if value="{{showGhost}}" hint-placeholder-val="{{ true }}">
        <div aria-hidden="true" style="{{ghostStyle}}">Describe how you want to change this song…</div>
      </sc-if>
      <sc-if value="{{showCaret}}" hint-placeholder-val="{{ false }}">
        <span aria-hidden="true" style="position: absolute; left: 19px; top: 20px; width: 2px; height: 26px; background: #ffc93c; pointer-events: none"></span>
      </sc-if>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="{{ctaWrap}}">
    <a href="CfGenRVibe.dc.html" onMouseDown="{{keep}}" style="height: 56px; border-radius: 28px; background: #ffc93c; color: #121212; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; text-decoration: none">Generate song</a>
  </div>

  <sc-if value="{{focus}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="flex-shrink: 0; background: #202020; padding: 8px 3px 26px; display: flex; flex-direction: column; gap: 10px; pointer-events: none">
      <div style="display: flex; gap: 6px; justify-content: center"><sc-for list="{{kb1}}" as="k" hint-placeholder-count="10"><span style="width: 32px; height: 42px; border-radius: 5px; background: #474747; display: flex; align-items: center; justify-content: center; font-size: 18px">{{k.l}}</span></sc-for></div>
      <div style="display: flex; gap: 6px; justify-content: center"><sc-for list="{{kb2}}" as="k" hint-placeholder-count="9"><span style="width: 32px; height: 42px; border-radius: 5px; background: #474747; display: flex; align-items: center; justify-content: center; font-size: 18px">{{k.l}}</span></sc-for></div>
      <div style="display: flex; gap: 6px; justify-content: center">
        <span style="width: 44px; height: 42px; border-radius: 5px; background: #2e2e2e"></span>
        <sc-for list="{{kb3}}" as="k" hint-placeholder-count="7"><span style="width: 32px; height: 42px; border-radius: 5px; background: #474747; display: flex; align-items: center; justify-content: center; font-size: 18px">{{k.l}}</span></sc-for>
        <span style="width: 44px; height: 42px; border-radius: 5px; background: #2e2e2e"></span>
      </div>
      <div style="display: flex; gap: 6px; padding: 0 3px">
        <span style="width: 88px; height: 42px; border-radius: 5px; background: #2e2e2e; display: flex; align-items: center; justify-content: center; font-size: 15px">123</span>
        <span style="flex-grow: 1; height: 42px; border-radius: 5px; background: #474747; display: flex; align-items: center; justify-content: center; font-size: 15px">space</span>
        <span style="width: 88px; height: 42px; border-radius: 5px; background: #2e2e2e; display: flex; align-items: center; justify-content: center; font-size: 15px">return</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","options":["resting","typed"],"default":"resting"},"$preview":{"width":390,"height":844}}'>
var keys = (s) => s.split('').map((l) => ({ l: l }));
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var typed = (props.start || 'resting') === 'typed';
    this.state = { text: typed ? 'Make it a stripped-back acoustic version for a rainy Sunday' : '', focus: typed, fake: typed };
  }
  renderVals() {
    var st = this.state;
    return {
      text: st.text, focus: st.focus, big: !st.focus,
      showGhost: !st.text,
      showCaret: st.focus && st.fake && !st.text,
      lineStyle: 'margin-top: ' + (st.focus ? '16px' : '24px') + '; padding-top: 16px; border-top: 1px solid #2e2e2e; text-align: center; font-size: ' + (st.focus ? '24px' : '30px') + '; line-height: 1.15; font-weight: 700',
      ghostStyle: 'position: absolute; ' + (st.focus ? 'left: 26px; ' : 'left: 20px; ') + 'top: 18px; right: 20px; pointer-events: none; font-size: 20px; line-height: 1.32; font-weight: 500; color: #737373',
      boxStyle: 'margin-top: 16px; position: relative; height: ' + (st.focus ? '132px' : '170px') + '; border-radius: 22px; background: #202020; border: 1px solid ' + (st.focus ? '#ffc93c' : '#2e2e2e'),
      ctaWrap: 'padding: 0 16px ' + (st.focus ? '14px' : '36px'),
      kb1: keys('qwertyuiop'), kb2: keys('asdfghjkl'), kb3: keys('zxcvbnm'),
      onText: (e) => this.setState({ text: e.target.value, fake: false }),
      onFocus: () => this.setState({ focus: true, fake: false }),
      onBlur: () => this.setState({ focus: false, fake: false }),
      keep: (e) => e.preventDefault()
    };
  }
}
</script>
</body>
</html>
